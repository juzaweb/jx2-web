# Machine-readable safety policy for jx2-web loops.
# Used by loop-gate: `npx @cobusgreyling/loop gate check --action <...> --paths <...>`
# Human-readable twin: docs/safety.md. Keep both in sync.
version: 1

denylist:
  - "**/.env"
  - "**/.env.*"
  - "**/secrets/**"
  - "**/credentials/**"
  - "**/*_key*"
  - "**/*_secret*"
  - "**/.terraform/**"
  - "**/k8s/production/**"
  - "**/migrations/**"
  - "**/auth/**"
  - "**/payments/**"
  - "**/billing/**"

# A diff touching more than this many files escalates to a human.
maxFiles: 10

# Branches the loop may auto-merge into. `main` is never in this list.
autoMergeTargets:
  - "develop"

# Paths eligible for auto-merge into an autoMergeTargets branch.
# Anything outside this list opens a PR and waits for a human merge.
autoMergeAllowlist:
  - "docs/**"
  - "**/*.md"
  - "**/*.test.js"
  - "src/**"

# Paths that always require a human merge, even if otherwise allowlisted.
humanMergeRequired:
  - "package.json"
  - "package-lock.json"
  - "vite.config.js"
  - ".github/**"
